name: Update NCAA Data
on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-ncaa-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run get_ncaa.py
        working-directory: src/data
        env:
          CFDBKEY: ${{ secrets.CFDBKEY }}
        run: python get_ncaa.py

      - name: Commit updated ncaa.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update ncaa.json with latest FBS team data'
          file_pattern: src/data/ncaa.json
